<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไม้ตกแมว DIY</title>
<meta name="description" content="ออกแบบไม้ตกแมวเอง เลือกความยาว วัสดุ ด้าม และตุ๊กตาที่ติดบนสาย พร้อมเช็กน้ำหนักที่ข้อมือและด้ามจับ แล้วบันทึก ซื้อเองที่ Shopee หรือสั่งให้ส่งถึงบ้าน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" id="skip" href="#panel"></a>

<header class="top">
  <div class="brand" id="brand"></div>
  <button class="langBtn" id="langBtn" type="button"></button>
</header>

<main class="builder">
  <section class="left">
    <div class="views" id="views" data-view="close">
    <div class="viewTabs" id="viewTabs" role="group">
      <button type="button" id="vtClose" aria-pressed="true"></button>
      <button type="button" id="vtScale" aria-pressed="false"></button>
    </div>
    <div class="stage" id="stage">
      <div class="stageHead">
        <h1 id="headline"></h1>
        <p id="specLine"></p>
      </div>
      <svg id="rod" viewBox="0 0 800 500" role="img"></svg>
      <span class="pill" id="pill" data-level="good"></span>
      <div class="stagePrice" aria-live="polite">
        <span class="stagePriceL" id="estTitle"></span>
        <span class="priceBox priceBox--stage" id="estTotal"></span>
        <span class="badge" id="estBadge"></span>
      </div>
      <button class="stageToggle" id="stageToggle" type="button" aria-controls="rod" aria-expanded="true"></button>
      <p class="tapHint" id="tapHint"></p>
    </div>

    <div class="scaleCard" id="scaleCard">
      <div class="scaleHead">
        <h2 id="scaleTitle"></h2>
        <span class="pill pill--inline" id="sizePill" data-level="good"></span>
      </div>
      <svg id="scaleSvg" viewBox="-50 -206 300 222" role="img"></svg>
      <p class="sizeSummary" id="sizeSummary" aria-live="polite"></p>
    </div>
    </div>

    <div class="gauges">
      <div class="gauge" id="gRod" data-level="good">
        <div class="gHead"><span id="gRodLabel"></span><strong id="gRodVal"></strong></div>
        <div class="track" id="gRodTrack" role="meter" aria-valuemin="0" aria-valuemax="130">
          <div class="fill" id="gRodFill"></div>
          <div class="limitMark"></div>
        </div>
        <p class="gNote" id="gRodNote"></p>
      </div>
      <div class="gauge" id="gWrist" data-level="good">
        <div class="gHead"><span id="gWristLabel"></span><strong id="gWristVal"></strong></div>
        <div class="track" id="gWristTrack" role="meter" aria-valuemin="0" aria-valuemax="130">
          <div class="fill" id="gWristFill"></div>
          <div class="limitMark limitMark--soft" id="gWristMarkGood"></div>
          <div class="limitMark"></div>
        </div>
        <p class="gNote" id="gWristNote"></p>
      </div>

      <div class="checks" aria-live="polite">
        <p class="verdict" id="vRod" data-level="good"><b id="vRodL"></b><span id="vRodT"></span></p>
        <p class="verdict" id="vWrist" data-level="good"><b id="vWristL"></b><span id="vWristT"></span></p>
        <p class="verdict" id="vGrip" data-level="good"><b id="vGripL"></b><span id="vGripT"></span></p>
        <p class="verdict" id="vCat" data-level="good"><b id="vCatL"></b><span id="vCatT"></span></p>
      </div>

      <details class="estimate estMore">
        <summary id="estMoreS"></summary>
        <table class="price"><tbody id="estBody"></tbody></table>
        <p class="fine" id="estNote"></p>
      </details>

      <details class="why">
        <summary id="whySummary"></summary>
        <ul>
          <li id="why1"></li>
          <li id="why2"></li>
          <li id="why3"></li>
          <li id="why4"></li>
          <li id="why5"></li>
        </ul>
        <p class="fine"><span id="whySources"></span>:
          <a href="https://www.ehstoday.com/health/ergonomics/ehs_imp_37964" target="_blank" rel="noopener">EHS Today</a>,
          <a href="https://iloencyclopaedia.org/part-iv-66769/ergonomics-52353/work-systems-design/item/634-tools" target="_blank" rel="noopener">ILO Encyclopaedia</a>,
          <a href="https://maddiesfund.org/kb-cat-toys-and-cat-play.htm" target="_blank" rel="noopener">Maddie's Fund</a>
        </p>
      </details>
    </div>
  </section>

  <section class="panel" id="panel" tabindex="-1">
    <fieldset class="step">
      <legend><span class="stepNum">1</span><span id="s1"></span></legend>
      <div class="sliderRow">
        <label for="lenRange" id="lenLabel"></label>
        <output id="lenOut" for="lenRange"></output>
      </div>
      <input type="range" id="lenRange" class="range">
      <div class="rangeEnds"><span id="lenMin"></span><span id="lenMax"></span></div>
      <p class="groupLabel" id="matLabel"></p>
      <div class="opts" id="matOpts" role="radiogroup" aria-labelledby="matLabel"></div>
      <p class="groupLabel" id="thickLabel"></p>
      <div class="opts opts--sizes" id="thickOpts" role="radiogroup" aria-labelledby="thickLabel"></div>
      <p class="groupLabel" id="rodColorLabel"></p>
      <div class="swatches" id="rodColorOpts" role="radiogroup" aria-labelledby="rodColorLabel"></div>
      <p class="fine" id="rodColorNote"></p>
    </fieldset>

    <fieldset class="step sizeStep">
      <legend><span id="sizeTitle"></span></legend>
      <p class="fine intro" id="sizeIntro"></p>
      <p class="verdict" id="sizeVerdict" data-level="good" aria-live="polite"></p>
      <button class="btn" id="sizeFix" type="button" hidden></button>
      <div class="sliderRow">
        <label for="personRange" id="personLabel"></label>
        <output id="personOut" for="personRange"></output>
      </div>
      <input type="range" id="personRange" class="range">
      <div class="rangeEnds"><span id="personMin"></span><span id="personMax"></span></div>
      <p class="groupLabel" id="catLabel"></p>
      <div class="opts opts--chips" id="catOpts" role="radiogroup" aria-labelledby="catLabel"></div>
      <p class="fine" id="sizeFine"></p>
      <p class="fine" id="marketNote" aria-live="polite"></p>
      <p class="fine" id="marketHandle"></p>
      <p class="fine"><span id="marketSrcL"></span>:
        <a href="https://articles.hepper.com/best-cat-wand-toys/" target="_blank" rel="noopener">Hepper</a>,
        <a href="https://www.blueskycats.com/best-cat-wand-toy/" target="_blank" rel="noopener">Blue Sky Cats</a>,
        <a href="https://catwisdom101.com/birbug-review-cat-wand-toys-comparison/" target="_blank" rel="noopener">Cat Wisdom 101</a>,
        <a href="https://www.homepro.co.th/p/888223500102" target="_blank" rel="noopener">HomePro</a>
      </p>
    </fieldset>

    <fieldset class="step">
      <legend><span class="stepNum">2</span><span id="s2"></span></legend>
      <div class="sliderRow">
        <label for="hlRange" id="hlLabel"></label>
        <output id="hlOut" for="hlRange"></output>
      </div>
      <input type="range" id="hlRange" class="range">
      <div class="rangeEnds"><span id="hlMin"></span><span id="hlMax"></span></div>
      <div class="opts opts--chips" id="handleOpts" role="radiogroup" aria-labelledby="s2"></div>
      <div id="hModeBox">
        <p class="groupLabel" id="hModeLabel"></p>
        <div class="opts" id="hModeOpts" role="radiogroup" aria-labelledby="hModeLabel"></div>
      </div>
      <p class="fine" id="hmNote" aria-live="polite"></p>
      <div id="handleColorBox">
        <p class="groupLabel" id="handleColorLabel"></p>
        <div class="swatches" id="handleColorOpts" role="radiogroup" aria-labelledby="handleColorLabel"></div>
      </div>
    </fieldset>

    <fieldset class="step">
      <legend><span class="stepNum">3</span><span id="s3"></span></legend>
      <div class="sliderRow">
        <label for="lineRange" id="lineLenLabel"></label>
        <output id="lineOut" for="lineRange"></output>
      </div>
      <input type="range" id="lineRange" class="range">
      <div class="rangeEnds"><span id="lineMin"></span><span id="lineMax"></span></div>
      <p class="fine" id="lineNote" hidden></p>
      <div id="lineTypeBox">
        <p class="groupLabel" id="lineTypeLabel"></p>
        <div class="opts" id="lineOpts" role="radiogroup" aria-labelledby="lineTypeLabel"></div>
        <p class="groupLabel" id="lineColorLabel"></p>
        <div class="swatches" id="lineColorOpts" role="radiogroup" aria-labelledby="lineColorLabel"></div>
      </div>
      <p class="groupLabel" id="hookLabel"></p>
      <div class="opts" id="hookOpts" role="radiogroup" aria-labelledby="hookLabel"></div>
      <p class="fine" id="hookNote"></p>
    </fieldset>

    <fieldset class="step">
      <legend><span class="stepNum">4</span><span id="s4"></span></legend>
      <p class="slots" id="slots" aria-live="polite"></p>
      <div class="toyGrid" id="toyGrid"></div>
      <h3 class="subhead" id="itemsTitle"></h3>
      <ul class="itemList" id="itemList"></ul>
      <div class="safety">
        <h3 class="subhead" id="safetyTitle"></h3>
        <ul class="safeList" id="safeList"></ul>
        <p class="fine"><span id="safeSrcL"></span> <a href="https://vcahospitals.com/know-your-pet/linear-foreign-body-in-cats" target="_blank" rel="noopener">VCA Animal Hospitals</a></p>
      </div>
    </fieldset>

    <section class="step finish">
      <h2 id="s5"></h2>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" id="tab-save" aria-controls="pane-save" aria-selected="true" type="button"></button>
        <button role="tab" id="tab-shopee" aria-controls="pane-shopee" aria-selected="false" tabindex="-1" type="button"></button>
        <button role="tab" id="tab-order" aria-controls="pane-order" aria-selected="false" tabindex="-1" type="button"></button>
      </div>

      <div class="pane" id="pane-save" role="tabpanel" aria-labelledby="tab-save">
        <div class="field">
          <label for="designName" id="nameLabel"></label>
          <input type="text" id="designName" maxlength="40" autocomplete="off">
        </div>
        <div class="btnRow">
          <button class="btn btn--primary" id="saveBtn" type="button"></button>
          <button class="btn" id="copyLinkBtn" type="button"></button>
        </div>
        <h3 id="myDesignsTitle"></h3>
        <ul class="saved" id="savedList"></ul>
      </div>

      <div class="pane" id="pane-shopee" role="tabpanel" aria-labelledby="tab-shopee" hidden>
        <p id="shopeeIntro"></p>
        <h3 id="partsTitle"></h3>
        <ul class="parts" id="partsList"></ul>
        <h3 id="suppliesTitle"></h3>
        <ul class="parts" id="suppliesList"></ul>
        <h3 id="stepsTitle"></h3>
        <ol class="assemble" id="assembleList"></ol>
        <p class="fine" id="affiliateNote" hidden></p>
      </div>

      <div class="pane" id="pane-order" role="tabpanel" aria-labelledby="tab-order" hidden>
        <div class="soon" id="orderSoon">
          <h3 id="soonTitle"></h3>
          <p id="soonText"></p>
          <div class="btnRow">
            <button class="btn btn--primary" id="soonSave" type="button"></button>
            <button class="btn" id="soonShopee" type="button"></button>
          </div>
        </div>
        <div id="orderLive" hidden>
        <h3 id="priceTitle"></h3>
        <table class="price"><tbody id="priceBody"></tbody></table>
        <p class="fine" id="priceNote"></p>
        <form id="orderForm" novalidate>
          <div class="field"><label for="fName" id="fNameL"></label><input id="fName" type="text" autocomplete="name"></div>
          <div class="field"><label for="fPhone" id="fPhoneL"></label><input id="fPhone" type="tel" autocomplete="tel"></div>
          <div class="field"><label for="fAddress" id="fAddressL"></label><textarea id="fAddress" rows="3" autocomplete="street-address"></textarea></div>
          <div class="field"><label for="fLine" id="fLineL"></label><input id="fLine" type="text" autocomplete="off"></div>
          <div class="field"><label for="fNote" id="fNoteL"></label><input id="fNote" type="text" autocomplete="off"></div>
          <p class="error" id="formError" role="alert" hidden></p>
          <div class="btnRow">
            <button class="btn btn--primary" id="sendLineBtn" type="button" hidden></button>
            <button class="btn btn--primary" id="sendEmailBtn" type="button" hidden></button>
            <button class="btn" id="copyOrderBtn" type="button"></button>
          </div>
        </form>
        </div>
      </div>
    </section>
  </section>
</main>

<footer class="foot" id="foot"></footer>
<div class="srcfoot"><a id="srcLink" href="https://github.com/sarail19th/diy-cat-rod" target="_blank" rel="noopener noreferrer">Source on GitHub</a></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
